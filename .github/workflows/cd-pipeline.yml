
name: Local Docker CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: cmd
        run: docker build -t local-cd-demo:latest .

      - name: Remove previous test container
        shell: cmd
        run: |
          docker rm -f local-cd-demo-test 2>nul
          exit /b 0

      - name: Start test container
        shell: cmd
        run: docker run -d --name local-cd-demo-test -p 5001:5000 local-cd-demo:latest

      - name: Verify test container
        shell: cmd
        run: |
          timeout /t 5 /nobreak >nul

          echo Checking React frontend...
          curl -f http://localhost:5001/
          if errorlevel 1 exit /b 1

          echo Checking Flask health endpoint...
          curl -f http://localhost:5001/health
          if errorlevel 1 exit /b 1

          echo Test container verification successful!

      - name: Remove test container
        if: always()
        shell: cmd
        run: |
          docker rm -f local-cd-demo-test 2>nul
          exit /b 0

      - name: Remove existing production container
        shell: cmd
        run: |
          docker rm -f local-cd-demo 2>nul
          exit /b 0

      - name: Deploy new production container
        shell: cmd
        run: docker run -d --name local-cd-demo --restart unless-stopped -p 5000:5000 local-cd-demo:latest

      - name: Verify production deployment
        shell: cmd
        run: |
          timeout /t 5 /nobreak >nul

          echo Checking React frontend...
          curl -f http://localhost:5000/
          if errorlevel 1 exit /b 1

          echo Checking Flask health endpoint...
          curl -f http://localhost:5000/health
          if errorlevel 1 exit /b 1

          echo Deployment successful!
