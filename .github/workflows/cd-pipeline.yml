
name: Local Docker CD Pipeline

# Trigger the pipeline whenever code is pushed to main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      # Step 1: Get the latest code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Build Docker image
      - name: Build Docker image
        run: docker build -t local-cd-demo:latest .

      # Step 3: Remove the old container if it exists
      - name: Remove existing container
        shell: pwsh
        run: |
          docker container inspect local-cd-demo *> $null

          if ($LASTEXITCODE -eq 0) {
              docker rm -f local-cd-demo
          }

      # Step 4: Start a new container
      - name: Deploy new container
        run: docker run -d --name local-cd-demo --restart unless-stopped -p 5000:5000 local-cd-demo:latest

      # Step 5: Verify deployment
      - name: Verify deployment
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5

          $response = Invoke-WebRequest `
            -Uri "http://localhost:5000" `
            -UseBasicParsing

          if ($response.StatusCode -ne 200) {
              throw "Deployment verification failed"
          }

          Write-Host "Deployment successful!"
          Write-Host $response.Content
