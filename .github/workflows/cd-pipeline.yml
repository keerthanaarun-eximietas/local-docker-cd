
name: Local Docker CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        shell: cmd
        run: docker build -t local-cd-demo:latest .

      - name: Remove existing container
        shell: cmd
        run: |
          docker rm -f local-cd-demo 2>nul
          exit /b 0

      - name: Deploy new container
        shell: cmd
        run: docker run -d --name local-cd-demo --restart unless-stopped -p 5000:5000 local-cd-demo:latest

      - name: Verify deployment
        shell: cmd
        run: |
          timeout /t 5 /nobreak >nul
          curl -f http://localhost:5000
          if errorlevel 1 exit /b 1
          echo Deployment successful!
